name: Build MOG Core (Autotools)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake autotools-dev bsdmainutils build-essential libboost-all-dev \
            libdb5.3++-dev libevent-dev libprotobuf-dev libssl-dev libzmq3-dev \
            pkg-config protobuf-compiler

      - name: Generate configure script
        run: ./autogen.sh

      - name: Configure
        run: ./configure --disable-wallet --without-gui --without-miniupnpc --disable-tests --disable-bench --with-tx

      - name: Build daemon, CLI, and transaction utility
        run: make -C src -j2

      - name: Check built binaries
        run: |
          ./src/mogd --version
          ./src/mog-cli --version
          ./src/mog-tx --help
