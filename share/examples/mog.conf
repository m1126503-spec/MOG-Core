# MOG Core
# Copy this file to ~/.mog/mog.conf (Linux/macOS) or %APPDATA%\MOG\mog.conf (Windows).

server=1
listen=1
txindex=1

# Main network port. Open this TCP port on the firewall if other people should connect.
port=9766

# There are no public DNS seeds yet. Point this at a node that is already running.
# addnode=203.0.113.10
# addnode=203.0.113.10:9766

rpcuser=mog
rpcpassword=replace-with-a-long-random-string
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
